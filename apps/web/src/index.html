<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Paperclip Workflow Runner</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="panel auth-panel">
        <h1>Paperclip Workflow Runner</h1>
        <p class="subtitle">Sign up or log in, then execute a workflow prompt.</p>
        <div class="auth-grid">
          <form id="signup-form" class="stack">
            <h2>Sign Up</h2>
            <input id="signup-email" type="email" placeholder="Email" required />
            <input id="signup-password" type="password" placeholder="Password" required />
            <button type="submit">Create Account</button>
          </form>
          <form id="login-form" class="stack">
            <h2>Log In</h2>
            <input id="login-email" type="email" placeholder="Email" required />
            <input id="login-password" type="password" placeholder="Password" required />
            <button type="submit">Log In</button>
          </form>
        </div>
        <div class="session-bar">
          <span id="session-state">Checking session…</span>
          <button id="logout-button" type="button">Log Out</button>
        </div>
      </section>

      <section class="panel workflow-panel">
        <h2>Run Workflow</h2>
        <form id="workflow-form" class="stack">
          <textarea id="workflow-prompt" rows="6" placeholder="Enter prompt..." required></textarea>
          <button id="workflow-submit" type="submit">Execute</button>
        </form>
        <p id="workflow-status" class="status"></p>
        <pre id="workflow-output" class="output" aria-live="polite"></pre>
      </section>
    </main>

    <script src="/app.js" defer></script>
  </body>
</html>
